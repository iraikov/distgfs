repos:
  - repo: local
    hooks:
      - id: fix-nonascii-comments
        name: Replace non-ASCII characters in comments
        language: python
        entry: python /home/igr/src/fix_nonascii_comments.py
        types: [python]
        additional_dependencies: [libcst]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-json
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.9
    hooks:
      - id: ruff
        args: [--fix, --extend-ignore, "F841,F401,E402"]
      - id: ruff-format
