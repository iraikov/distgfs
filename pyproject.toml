[project]
name = "distgfs"
version = "1.5.0"
description = "Distributed global function search via dlib"
authors = [
    {name = "Ivan Raikov", email = "ivan.g.raikov@gmail.com"},
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
keywords = ["optimization", "distributed optimization", "GFS", "MPI", "mpi4py", "distributed computing"]
requires-python = ">=3.9"
dependencies = [
    "mpi4py>=3.1.3",
    "numpy>=1.23.3",
    "h5py>=3.7.0",
    "dlib>=19.24.0",
    "distwq>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.3.0",
    "flake8>=5.0.4",
    "pre-commit>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["distgfs.py"]

[tool.hatch.build.targets.wheel]
include = ["distgfs.py"]
